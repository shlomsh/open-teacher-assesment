      <stop offset="0%" style="stop-color:#ede6d8"/>
      <stop offset="100%" style="stop-color:#e4dcd0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- two-tone title, centered -->
  <text x="600" y="250" font-family="Georgia,'Times New Roman',serif" font-size="80" font-weight="700"
