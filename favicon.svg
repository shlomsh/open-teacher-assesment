<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#155e57"/>
  <g transform="rotate(-45,32,32)" stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- eraser cap -->
    <rect x="26" y="10" width="12" height="6" rx="1.5" stroke-width="2" fill="white" fill-opacity="0.15"/>
    <!-- eraser band -->
    <line x1="26" y1="16" x2="38" y2="16" stroke-width="1.5"/>
    <!-- body outline -->
    <rect x="26" y="19" width="12" height="22" stroke-width="2"/>
    <!-- center line on body -->
    <line x1="32" y1="19" x2="32" y2="41" stroke-width="1" stroke-opacity="0.4"/>
    <!-- tip -->
    <polyline points="26,41 32,54 38,41" stroke-width="2"/>
    <!-- tip crease -->
    <line x1="32" y1="41" x2="32" y2="49" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>
