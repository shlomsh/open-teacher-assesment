<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צפייה בבחינות תלמידים</title>
<style>
  :root { --ink:#1f2733; --muted:#6b7686; --line:#e3e8ef; --accent:#3a4a69; --chip:#eef2fb; --bg:#f6f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.65 "Segoe UI",Arial,"Helvetica Neue",sans-serif; }
  a { color:inherit; }
  .wrap { max-width:900px; margin:0 auto; padding:28px 20px 80px; }

  /* top bar */
  .topbar { position:sticky; top:0; z-index:5; background:rgba(246,247,251,.92);
            backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .topbar .row { max-width:900px; margin:0 auto; padding:12px 20px; display:flex;
                 align-items:center; gap:12px; flex-wrap:wrap; }
  .topbar .title { font-weight:700; color:var(--accent); margin-inline-end:auto; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff;
           color:var(--accent); border-radius:9px; padding:8px 14px; font-weight:600; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:hover { box-shadow:0 2px 8px rgba(58,74,105,.12); }
  .folder-name { font-size:13px; color:var(--muted); }

  /* welcome */
  .welcome { text-align:center; padding:80px 20px; }
  .welcome h1 { color:var(--accent); font-size:26px; margin:0 0 8px; }
  .welcome p { color:var(--muted); max-width:520px; margin:0 auto 26px; }
  .welcome .big { font-size:17px; padding:14px 26px; }
  .hint { font-size:13px; color:var(--muted); margin-top:18px; }
  .err { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:10px;
         padding:12px 16px; max-width:560px; margin:18px auto 0; text-align:start; }

  /* nav grid */
  h1.page-h { color:var(--accent); font-size:24px; margin:6px 0 4px; }
  p.lede { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  a.card { display:block; text-decoration:none; background:#fff; border:1px solid var(--line);
           border-radius:14px; padding:18px 20px; transition:.12s; }
  a.card:hover { border-color:var(--accent); box-shadow:0 4px 14px rgba(58,74,105,.12); transform:translateY(-1px); }
  .card .sid { font-size:20px; font-weight:700; color:var(--accent); }
  .card .sub { color:var(--muted); font-size:13px; min-height:18px; margin:2px 0 10px; }
  .card .go { font-size:14px; color:var(--accent); font-weight:600; }

  /* student page */
  .backlink { display:inline-block; margin-bottom:14px; color:var(--accent); font-weight:600;
              text-decoration:none; }
  header.exam { background:#fff; border:1px solid var(--line); border-radius:14px;
                padding:20px 24px; margin-bottom:24px; }
  header.exam h2 { margin:0 0 6px; font-size:22px; color:var(--accent); }
  header.exam .meta { color:var(--muted); font-size:14px; display:flex; gap:18px; flex-wrap:wrap; }
  header.exam .meta b { color:var(--ink); font-weight:600; }
  .answered { margin-top:10px; font-size:13px; color:var(--muted); }
  section.q { background:#fff; border:1px solid var(--line); border-radius:14px;
              padding:18px 22px; margin-bottom:18px; }
  section.q h3 { margin:0 0 12px; font-size:18px; color:var(--accent);
                 border-bottom:1px solid var(--line); padding-bottom:10px; }
  .stimulus { margin:4px 0 16px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:10px; }
  .thumb { display:block; border:1px solid var(--line); border-radius:10px; overflow:hidden;
           background:#fafbfd; line-height:0; }
  .thumb img { max-height:220px; max-width:300px; width:auto; height:auto; display:block; }
  .thumb:hover { border-color:var(--accent); }
  .missing { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:10px;
             padding:10px 14px; font-size:14px; margin-top:8px; }
  details.prompt { background:#fbfcfe; border:1px solid var(--line); border-radius:10px;
                   padding:8px 14px; margin:0 0 16px; }
  details.prompt > summary { cursor:pointer; font-weight:600; color:var(--accent); font-size:14px; }
  .prompt-body { margin-top:10px; color:#3c4757; font-size:15px; }
  .prompt-body table { width:auto !important; max-width:100%; border-collapse:collapse; }
  .prompt-body select { max-width:100%; }
  .answers-head { font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.04em; margin:6px 0 2px; }
  .ans { display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .ans:last-child { border-bottom:0; }
  .ans-tag { flex:0 0 34px; height:34px; line-height:34px; text-align:center; background:var(--chip);
             color:var(--accent); border-radius:8px; font-weight:700; font-size:15px; }
  .ans-body { flex:1; } .ans-body p { margin:0 0 .4em; }
  .chip { background:var(--chip); border:1px solid #d6def0; border-radius:999px; padding:2px 12px; display:inline-block; }
  .asset .ans-body { color:var(--muted); }
  .spinner { text-align:center; color:var(--muted); padding:60px; }
  code { background:#f0f2f7; padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
  <div id="topbar"></div>
  <div class="wrap"><div id="app"></div></div>
  <script src="app.js"></script>
</body>
</html>
